<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>คู่หาร — หารค่าใช้จ่ายกับแฟน</title>
  <meta name="theme-color" content="#22314D" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- ===================== หน้าตั้งค่าห้อง ===================== -->
  <div id="setup-screen">
    <h1>คู่หาร</h1>
    <p class="lede">ตั้งห้องเดียวกันกับแฟน แล้วใช้จดค่าใช้จ่ายร่วมกันได้เลย ไม่ต้องสมัครสมาชิก</p>

    <form id="setup-form">
      <div class="field">
        <label for="room-code">รหัสห้อง (ตั้งเองได้ ให้แฟนใช้รหัสเดียวกัน)</label>
        <input id="room-code" type="text" placeholder="เช่น nanbowbow2026" required />
      </div>

      <div class="pill-row">
        <div class="field">
          <label for="name-a">ชื่อคนที่ 1</label>
          <input id="name-a" type="text" placeholder="เช่น แนน" />
        </div>
        <div class="field">
          <label for="name-b">ชื่อคนที่ 2</label>
          <input id="name-b" type="text" placeholder="เช่น โบว์" />
        </div>
      </div>

      <div class="field">
        <label>คุณคือใคร</label>
        <div class="who-choice">
          <button type="button" data-who="a">คนที่ 1</button>
          <button type="button" data-who="b">คนที่ 2</button>
        </div>
      </div>

      <button type="submit" class="primary">เข้าห้อง</button>
    </form>

    <p class="setup-note">ถ้าห้องนี้มีอยู่แล้ว ระบบจะใช้ชื่อที่ตั้งไว้ตอนสร้างห้องครั้งแรก ช่องชื่อจะถูกข้ามไปเอง</p>
  </div>

  <!-- ===================== หน้าแอปหลัก ===================== -->
  <div id="app-screen">
    <div class="hero">
      <div class="room-label" id="room-label"></div>
      <div class="balance-line" id="balance-line">กำลังโหลด...</div>
      <div class="balance-amount" id="balance-amount">฿0</div>
    </div>

    <div class="list-wrap">
      <div class="list-header">
        <h2>รายการค่าใช้จ่าย</h2>
        <button id="change-room-btn" class="delete-btn" style="font-size:0.8rem;">เปลี่ยนห้อง</button>
      </div>

      <div id="empty-state" class="empty-state" style="display:none;">
        ยังไม่มีรายการ<br/>กดปุ่ม + ด้านล่างเพื่อเริ่มจดรายการแรก
      </div>

      <div id="expense-list"></div>
    </div>

    <button id="fab-add" class="fab">+ เพิ่มรายการ</button>
  </div>

  <!-- ===================== ฟอร์มเพิ่มรายการ (bottom sheet) ===================== -->
  <div id="sheet-backdrop" class="sheet-backdrop">
    <div class="sheet">
      <h2>เพิ่มรายการค่าใช้จ่าย</h2>
      <form id="add-form">
        <div class="field">
          <label for="expense-title">รายการ</label>
          <input id="expense-title" type="text" placeholder="เช่น ค่าข้าวเย็น" required />
        </div>

        <div class="field">
          <label for="expense-amount">จำนวนเงิน (บาท)</label>
          <input id="expense-amount" type="number" min="0" step="0.01" placeholder="0" required />
        </div>

        <div class="field">
          <label>ใครจ่าย</label>
          <div class="who-choice">
            <button type="button" data-who="a"><span data-name-slot="a">คนที่ 1</span></button>
            <button type="button" data-who="b"><span data-name-slot="b">คนที่ 2</span></button>
          </div>
        </div>

        <div class="field">
          <label>หารยังไง</label>
          <div class="split-choice">
            <button type="button" data-split="50-50" class="selected">หารครึ่ง</button>
            <button type="button" data-split="full">ออกให้ทั้งหมด (อีกคนค้างเต็ม)</button>
          </div>
        </div>

        <div class="sheet-actions">
          <button type="button" id="sheet-cancel" class="secondary">ยกเลิก</button>
          <button type="submit" class="primary">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
